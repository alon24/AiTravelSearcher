name = "skyhop-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (never commit them): SERPAPI_API_KEY and OPENROUTER_API_KEY are copied by CI from GitHub secrets of the same
# name; APP_TOKEN (optional) with `npx wrangler secret put APP_TOKEN`.
# GOOGLE_CLIENT_ID and ALLOWED_EMAILS are passed at deploy time by CI from the SKYHOP_GOOGLE_CLIENT_ID and
# SKYHOP_ALLOWED_EMAILS GitHub variables; keep_vars keeps anything set in the dashboard instead.
keep_vars = true

[vars]
JEV_MODEL = "typesafe/jev-1.13"
CHAT_MODEL = "openai/gpt-4o-mini"

# Shared trips (src/trips.js): one SQLite-backed Durable Object per trip; available on the Workers free plan.
[[durable_objects.bindings]]
name = "TRIPS"
class_name = "SharedTrip"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SharedTrip"]

# Airline search links the desktop extension learned, shared with phones (src/links.js): one SQLite-backed object.
[[durable_objects.bindings]]
name = "LINKS"
class_name = "SearchLinks"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SearchLinks"]
