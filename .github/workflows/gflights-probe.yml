name: Google Flights from the cloud

# Does Google Flights still answer the Worker's free scraper (worker/src/gflights.js) from a data-centre IP (GitHub's
# runners)? Runs every morning: when Google changes its page, the run fails and opens (or comments on) a
# "gflights broken" issue, so the breakage is found here and not by someone searching.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gflights-probe.yml
      - worker/src/gflights.js
      - worker/tools/probe.js

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The Worker's scraper, ten lookups a month ahead
        id: worker
        continue-on-error: true
        run: node worker/tools/probe.js
      - name: Open or update the "gflights broken" issue
        if: github.event_name == 'schedule' && steps.worker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Free Google Flights fares failed today's check (the Worker's scraper). The run's log shows each lookup and Google's answer: ${run}"
          open=$(gh issue list --state open --search "in:title gflights broken" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "gflights broken: Google Flights stopped answering the free scraper" --body "$body"; fi
      - name: Fail when the scraper failed
        if: steps.worker.outcome == 'failure'
        run: exit 1
