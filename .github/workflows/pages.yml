name: Test and deploy to Pages

# Every push runs the tests; a push to main also publishes the site (tools/build_pages.py) to GitHub Pages
# and, once a Cloudflare token is set, deploys the Worker that holds the API keys (worker/README.md).
# One-time setup: Settings -> Pages -> Source: GitHub Actions. Real fares: see worker/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -rs -n auto           # tests run in parallel; each worker starts its own servers
      - run: node src/flightagent/web/airport-search.test.js
      - run: node src/flightagent/web/hub.test.js
      - run: node --test tests/js/          # the in-page engine (web/local/*.js)

  build:
    needs: [test, deploy-worker]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_pages.py _site
        env:     # empty until the Worker is set up: the site then offers demo fares only
          SKYHOP_WORKER_URL: ${{ vars.SKYHOP_WORKER_URL || needs.deploy-worker.outputs.url }}
          SKYHOP_GOOGLE_CLIENT_ID: ${{ vars.SKYHOP_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.wrangler.outputs.url }}    # the site uses it unless the SKYHOP_WORKER_URL variable says otherwise
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Everything else can live in GitHub too, so the Cloudflare dashboard is never needed (worker/README.md):
      ALLOWED_EMAILS: ${{ vars.SKYHOP_ALLOWED_EMAILS }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy the Worker (skipped until the CLOUDFLARE_API_TOKEN secret exists)
        id: wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          vars=(--var "GOOGLE_CLIENT_ID:${{ vars.SKYHOP_GOOGLE_CLIENT_ID }}")
          if [ -n "$ALLOWED_EMAILS" ]; then vars+=(--var "ALLOWED_EMAILS:$ALLOWED_EMAILS"); fi
          npx --yes wrangler@4 deploy "${vars[@]}" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
          for name in SERPAPI_API_KEY OPENROUTER_API_KEY; do        # secrets set in GitHub are copied to the Worker
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx --yes wrangler@4 secret put "$name"; fi
          done
