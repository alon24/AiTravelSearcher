[project]
name = "flightagent"
version = "0.1.0"
description = "Flexible-date flight search agent: open-jaw, multi-destination, virtual interlining, self-transfer"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic>=2", "httpx", "python-dotenv", "primp>=2", "selectolax", "typing_extensions", "tzdata"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]
# On-demand El Al verification (providers/elal_verify.py) -- currently blocked by El Al's own
# anti-bot vendor (see docs/DESIGN.md); kept in case that changes. Not a core dependency.
verify = ["playwright"]

[project.scripts]
flightagent = "flightagent.cli:main"
flightagent-chat = "flightagent.cli:chat_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightagent = ["web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: a UI test that also runs against the Python service (the Docker version)"]
